<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Offline · ProcureFlow</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <!-- Self-contained on purpose: this page is what the service worker serves
         when the network is gone, so it cannot depend on anything else loading. -->
    <style>
      :root {
        --page-bg: #f6f4ee;
        --card-bg: #ffffff;
        --line: #e4dfd1;
        --ink: #1c1b18;
        --muted: #66625a;
        --accent: #0a6ed1;
        --accent-2: #0854a0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--page-bg);
        color: var(--ink);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 32px 28px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 22px;
      }
      h1 { margin: 16px 0 6px; font-size: 18px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      button {
        margin-top: 20px;
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: var(--accent-2); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">P</span>
      <h1>You're offline</h1>
      <p>
        ProcureFlow needs a connection to show live approvals, invoices and payments. Anything
        you already saved is safe. This page reloads by itself when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
